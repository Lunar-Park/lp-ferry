# The Park plugin only. Ferry itself is the Go binary (cmd/ferry, see Makefile);
# the plugin is a thin adapter that talks to the local `ferry daemon` over its
# socket. The distribution keeps its old name so existing Park installs resolve it.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "file-ferry"
version = "0.4.0"
description = "Park plugin for ferry: card offloads, machine-to-machine sends, receipts, proxies and Resolve projects, backed by the ferry daemon."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Lunar Park" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

# Park loads the adapter from this entry point (or from PARK_PLUGIN_PATHS).
[project.entry-points."park.plugins"]
ferry = "park_plugins.ferry"

[project.urls]
Homepage = "https://github.com/Lunar-Park/lp-ferry"
Source = "https://github.com/Lunar-Park/lp-ferry"
Issues = "https://github.com/Lunar-Park/lp-ferry/issues"

[tool.hatch.build.targets.wheel]
packages = ["park_plugins"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["park_plugins", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
pythonpath = ["."]
