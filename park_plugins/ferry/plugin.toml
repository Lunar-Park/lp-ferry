id = "ferry"
name = "File Ferry"
version = "0.4.0"
park = ">=0.1,<0.2"
summary = "Ingest through the ferry engine: card offloads, machine-to-machine sends, receipts, proxies and Resolve projects."
modules = ["park_plugins.ferry.records", "park_plugins.ferry.ops"]

[app]
title = "File Ferry"
description = "Ingest, transfers and proxies"
category = "Media"
icon = "folder"
tint = "amber"
source = "https://github.com/Lunar-Park/lp-ferry"

[app.standalone]
name = "Ferry"
bundle_id = "dev.lunarpark.ferry"

[[views]]
id = "ingest"
title = "Ferry"
entry = "views/ingest.js"
place = "library"
scoped = true
requires = ["ferry.ingest.list", "ferry.plan"]
hint = "bring media in: cards, proxies and transfers"

[[calls]]
name = "plan"
handler = "park_plugins.ferry.jobs:plan"
needs = []
timeout = 120

[[jobs]]
name = "copy"
handler = "park_plugins.ferry.jobs:copy"
needs = []
egress = "none"

[[calls]]
name = "engine"
handler = "park_plugins.ferry.jobs:engine_call"
needs = []
timeout = 30

[[jobs]]
name = "send"
handler = "park_plugins.ferry.jobs:send"
needs = []
egress = "lan"

[[jobs]]
name = "proxy"
handler = "park_plugins.ferry.jobs:proxy"
needs = ["ffmpeg"]
egress = "none"

[[jobs]]
name = "resolve"
handler = "park_plugins.ferry.jobs:resolve"
needs = []
egress = "none"

# A Ferry transfer as a card Park can draw: the same JSON per state a Slate reply would draw,
# served from this package (/plugins/ferry/cards/transfer.json). Approve/Decline decide the
# Park clearance an agent's transfer waits on; the app opens Ferry for the rest.
[[cards]]
id = "transfer"
resource = "park.job"
match = { plugin = "ferry", name = "send" }
template = "cards/transfer.json"

[[cards.actions]]
id = "approve"
label = "Approve"
tone = "ok"
op = "machines.clearance.grant"

[[cards.actions]]
id = "decline"
label = "Decline"
tone = "bad"
op = "machines.clearance.deny"

[[cards.actions]]
id = "retry"
label = "Retry"
op = "ferry.transfer.start"

[[cards.actions]]
id = "open"
label = "Open in Ferry"
app = true

[[cards]]
id = "copy"
resource = "park.job"
match = { plugin = "ferry", name = "copy" }
template = "cards/transfer.json"

[[cards.actions]]
id = "approve"
label = "Approve"
tone = "ok"
op = "machines.clearance.grant"

[[cards.actions]]
id = "decline"
label = "Decline"
tone = "bad"
op = "machines.clearance.deny"

[[cards.actions]]
id = "retry"
label = "Retry"
op = "ferry.offload"

[[cards.actions]]
id = "open"
label = "Open in Ferry"
app = true

# The command an agent drives, for the Agent-CLI contract check (scripts/check-plugins.py --cli).
[cli]
command = "ferry"
json = true
