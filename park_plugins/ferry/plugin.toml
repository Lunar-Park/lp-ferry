id = "ferry"
name = "File Ferry"
version = "0.2.0"
park = ">=0.1"
summary = "Ingest through the ferry engine: card offloads, machine-to-machine sends, receipts, proxies and Resolve projects."
modules = ["park_plugins.ferry.records", "park_plugins.ferry.ops"]

[[calls]]
name = "plan"
handler = "park_plugins.ferry.jobs:plan"
needs = []
timeout = 120

[[jobs]]
name = "copy"
handler = "park_plugins.ferry.jobs:copy"
needs = []
egress = "none"

[[calls]]
name = "engine"
handler = "park_plugins.ferry.jobs:engine_call"
needs = []
timeout = 30

[[jobs]]
name = "send"
handler = "park_plugins.ferry.jobs:send"
needs = []
egress = "lan"

[[jobs]]
name = "proxy"
handler = "park_plugins.ferry.jobs:proxy"
needs = ["ffmpeg"]
egress = "none"

[[jobs]]
name = "resolve"
handler = "park_plugins.ferry.jobs:resolve"
needs = []
egress = "none"
