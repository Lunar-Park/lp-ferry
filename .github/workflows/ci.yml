name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Ferry is the Go binary (cmd/ferry, internal/). The Park plugin
# (park_plugins/ferry) is a thin Python adapter over the ferry daemon.
#
# Branch protection: these jobs replace the retired Python and desktop
# jobs, so the required check names on `main` must be updated to
# "go (ubuntu-latest)", "go (macos-latest)" and "park plugin" in the same
# change, or every PR waits on checks that no longer report.

jobs:
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: make vet

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Test (race)
        run: make race

      - name: Static cross-builds
        if: matrix.os == 'ubuntu-latest'
        run: make cross

      - name: Release config check
        if: matrix.os == 'ubuntu-latest'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check

  park-plugin:
    name: park plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Lint
        run: |
          python -m pip install --upgrade pip ruff pytest
          ruff check park_plugins tests
          ruff format --check park_plugins tests

      # test_standalone.py runs here: the manifest, imports without Park, the
      # config-to-engine mapping and the engine client's wire protocol. The
      # behavioral modules need Park itself (and build the ferry binary), so
      # they skip on this runner. Run them with Park on PYTHONPATH:
      #   PYTHONPATH=../park:. python -m pytest tests/park_plugin
      - name: Standalone plugin tests
        run: python -m pytest tests/park_plugin -q

      # A green run must not read as coverage it did not have. Do not turn
      # this into a pass/fail on Park's availability.
      - name: Report the Park plugin tests this run did not exercise
        run: |
          files=$(grep -l 'importorskip("park"' tests/park_plugin/test_*.py)
          count=$(grep -hoE "^[[:space:]]*def test_" $files | wc -l | tr -d ' ')
          echo "::warning title=Park plugin tests not run::$count Park-dependent test functions (offload, send, plan, ingest, machines, proxy, resolve) did not run in this job: park is not installed."
